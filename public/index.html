<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Voice Call Center</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 70rem; padding: 0 1rem; }
      button, input, textarea, select { font-size: 1rem; padding: .55rem; }
      section { border: 1px solid #ddd; border-radius: .5rem; margin: 1rem 0; padding: 1rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #ddd; padding: .55rem; text-align: left; vertical-align: top; }
      .muted { color: #666; }
      #status { min-height: 1.5rem; margin: 1rem 0; }
      #transcript { background: #f4f4f4; border-radius: .5rem; min-height: 8rem; padding: 1rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>AI voice prototype</h1>
    <p>Start a browser session and speak through your microphone.</p>
    <form id="auth">
      <input id="company-name" placeholder="Company name (registration only)" />
      <input id="email" type="email" placeholder="Email" required />
      <input id="password" type="password" placeholder="Password (12+ characters)" required />
      <button type="submit">Register</button>
      <button id="login" type="button">Log in</button>
    </form>
    <button id="logout" type="button">Log out</button>
    <label>
      Agent
      <select id="agent" disabled>
        <option>Loading agents...</option>
      </select>
    </label>
    <p>Each browser session gets its own independent realtime conversation.</p>
    <button id="start">Start voice session</button>
    <button id="stop" disabled>Stop</button>
    <p id="status">Ready.</p>
    <div id="transcript" aria-live="polite"></div>
    <section id="dashboard" hidden>
      <h2>Call dashboard</h2>
      <button id="refresh-calls" type="button">Refresh calls</button>
      <table>
        <thead><tr><th>Started</th><th>Agent</th><th>Status</th><th>Summary</th><th>Details</th></tr></thead>
        <tbody id="calls"></tbody>
      </table>
      <h2>Agent settings</h2>
      <div id="agent-settings"></div>
    </section>
    <script type="module" src="/app.js"></script>
  </body>
</html>
